<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">photoSyncer 同步流程</title>
  <desc id="desc">小米云和 iCloud 经过校验后写入统一的照片目录，并可由群晖 Photos 建立索引。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="xiaomi" x1="0" x2="1"><stop stop-color="#ff8a00"/><stop offset="1" stop-color="#ffbd45"/></linearGradient>
    <linearGradient id="apple" x1="0" x2="1"><stop stop-color="#5e6ad2"/><stop offset="1" stop-color="#9c8cf2"/></linearGradient>
    <linearGradient id="nas" x1="0" x2="1"><stop stop-color="#00a884"/><stop offset="1" stop-color="#45c9a7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#37517e" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8ba8"/></marker>
    <style>
      .card{font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff;text-anchor:middle}
      .sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#edf4ff;text-anchor:middle}
      .line{stroke:#7b8ba8;stroke-width:4;fill:none;marker-end:url(#arrow);stroke-dasharray:12 12;animation:flow 1.8s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-48}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="700" fill="#26344d">photoSyncer：下载、校验、发布</text>
  <g filter="url(#shadow)">
    <rect x="60" y="112" width="220" height="126" rx="22" fill="url(#xiaomi)"/>
    <text x="170" y="158" class="card">小米云</text><text x="170" y="190" class="sub">相册 / 动态照片</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="60" y="258" width="220" height="0" rx="22" fill="url(#apple)"/>
    <rect x="60" y="112" width="220" height="126" rx="22" fill="url(#apple)" transform="translate(0 146)"/>
    <text x="170" y="304" class="card">Apple iCloud</text><text x="170" y="336" class="sub">照片 / Live Photo</text>
  </g>
  <path class="line" d="M280 175 H438"/><path class="line" d="M280 321 H438"/>
  <g filter="url(#shadow)">
    <rect x="438" y="112" width="270" height="212" rx="22" fill="#273b63"/>
    <text x="573" y="168" class="card">photoSyncer</text>
    <text x="573" y="205" class="sub">增量扫描 · 来源校验</text>
    <text x="573" y="232" class="sub">备份 / 镜像 · 失败重试</text>
    <text x="573" y="259" class="sub">单份文件 · 账号隔离</text>
  </g>
  <path class="line" d="M708 218 H860"/>
  <g filter="url(#shadow)">
    <rect x="860" y="112" width="280" height="212" rx="22" fill="url(#nas)"/>
    <text x="1000" y="168" class="card">统一目标目录</text>
    <text x="1000" y="205" class="sub">/photos/&lt;厂商-账号&gt;/...</text>
    <text x="1000" y="232" class="sub">可选 Synology Photos 适配</text>
    <text x="1000" y="259" class="sub">群晖自动索引与展示</text>
  </g>
</svg>
