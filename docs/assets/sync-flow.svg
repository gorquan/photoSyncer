<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">photoSyncer 同步流程</title>
  <desc id="desc">从小米云和 Apple iCloud 获取媒体，经过扫描校验后写入本地照片目录，并可供 Synology Photos 索引。</desc>
  <style>
    .title { font: 700 42px "PingFang SC", "Hiragino Sans GB", Arial, sans-serif; fill: #1f2f4a; text-anchor: middle; }
    .card { font: 700 36px "PingFang SC", "Hiragino Sans GB", Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    .sub { font: 400 24px "PingFang SC", "Hiragino Sans GB", Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    .flow { stroke: #506b95; stroke-width: 9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1600" height="620" rx="28" fill="#f2f6fc"/>
  <text x="800" y="72" class="title">photoSyncer：下载、校验、发布</text>

  <rect x="70" y="150" width="350" height="140" rx="24" fill="#f28c18"/>
  <text x="245" y="210" class="card">小米云</text>
  <text x="245" y="254" class="sub">相册 · 动态照片</text>

  <rect x="70" y="360" width="350" height="140" rx="24" fill="#5b5bd6"/>
  <text x="245" y="420" class="card">Apple iCloud</text>
  <text x="245" y="464" class="sub">照片 · Live Photo</text>

  <path class="flow" d="M420 220 C500 220 510 270 600 270"/>
  <path class="flow" d="M420 430 C500 430 510 350 600 350"/>
  <path class="flow" d="M1000 325 H1190"/>
  <path d="M600 270 l-28 -18 v36 z" fill="#506b95"/>
  <path d="M600 350 l-28 -18 v36 z" fill="#506b95"/>
  <path d="M1190 325 l-28 -18 v36 z" fill="#506b95"/>

  <rect x="600" y="170" width="400" height="310" rx="26" fill="#274a7c"/>
  <text x="800" y="245" class="card">photoSyncer</text>
  <text x="800" y="302" class="sub">扫描 · 增量 · 重试</text>
  <text x="800" y="346" class="sub">来源校验 · 文件保护</text>
  <text x="800" y="390" class="sub">备份 / 镜像 · 账号隔离</text>
  <text x="800" y="434" class="sub">可选群晖 Photos 适配</text>

  <rect x="1190" y="170" width="340" height="310" rx="26" fill="#109879"/>
  <text x="1360" y="245" class="card">本地照片目录</text>
  <text x="1360" y="302" class="sub">/photos/&lt;厂商-账号&gt;/...</text>
  <text x="1360" y="352" class="sub">统一保存 · 单份文件</text>
  <text x="1360" y="402" class="sub">Synology Photos</text>
  <text x="1360" y="446" class="sub">自动索引与展示</text>
</svg>
