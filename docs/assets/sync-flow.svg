<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">photoSyncer 同步流程</title>
  <desc id="desc">从小米云和 Apple iCloud 获取媒体，经过扫描校验后写入本地照片目录，并可供 Synology Photos 索引。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f0ff"/></linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7a00"/><stop offset="1" stop-color="#ffb72e"/></linearGradient>
    <linearGradient id="apple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#535bd8"/><stop offset="1" stop-color="#9a86ed"/></linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#203a68"/><stop offset="1" stop-color="#37619b"/></linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#008e70"/><stop offset="1" stop-color="#28b394"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#29436f" flood-opacity=".16"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#6e82a4"/></marker>
    <style>
      .title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2f4a;text-anchor:middle}
      .card{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff;text-anchor:middle}
      .sub{font:400 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f1f6ff;text-anchor:middle}
      .arrow{stroke:#6e82a4;stroke-width:8;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-dasharray:18 18;animation:move 1.8s linear infinite}
      .dot{fill:#fff;opacity:.85;animation:pulse 1.8s ease-in-out infinite}
      @keyframes move{to{stroke-dashoffset:-72}}
      @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1600" height="620" rx="34" fill="url(#bg)"/>
  <text x="800" y="72" class="title">photoSyncer：下载、校验、发布</text>
  <g filter="url(#shadow)">
    <rect x="70" y="150" width="350" height="140" rx="28" fill="url(#source)"/>
    <text x="245" y="207" class="card">小米云</text><text x="245" y="250" class="sub">相册 · 动态照片</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="360" width="350" height="140" rx="28" fill="url(#apple)"/>
    <text x="245" y="417" class="card">Apple iCloud</text><text x="245" y="460" class="sub">照片 · Live Photo</text>
  </g>
  <path class="arrow" d="M420 220 C500 220 510 270 600 270"/><path class="arrow" d="M420 430 C500 430 510 350 600 350"/>
  <circle class="dot" cx="520" cy="269" r="9"/><circle class="dot" cx="520" cy="391" r="9"/>
  <g filter="url(#shadow)">
    <rect x="600" y="170" width="400" height="310" rx="30" fill="url(#engine)"/>
    <text x="800" y="245" class="card">photoSyncer</text>
    <text x="800" y="300" class="sub">扫描 · 增量 · 重试</text>
    <text x="800" y="340" class="sub">来源校验 · 文件保护</text>
    <text x="800" y="380" class="sub">备份 / 镜像 · 账号隔离</text>
    <text x="800" y="420" class="sub">可选群晖 Photos 适配</text>
  </g>
  <path class="arrow" d="M1000 325 H1190"/><circle class="dot" cx="1095" cy="325" r="10"/>
  <g filter="url(#shadow)">
    <rect x="1190" y="170" width="340" height="310" rx="30" fill="url(#target)"/>
    <text x="1360" y="245" class="card">本地照片目录</text>
    <text x="1360" y="300" class="sub">/photos/&lt;厂商-账号&gt;/...</text>
    <text x="1360" y="350" class="sub">统一保存 · 单份文件</text>
    <text x="1360" y="400" class="sub">Synology Photos</text>
    <text x="1360" y="440" class="sub">自动索引与展示</text>
  </g>
</svg>
