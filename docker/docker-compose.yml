name: photosyncer

services:
  app:
    image: photosyncer:local
    build:
      context: .
      dockerfile: Dockerfile.jvm
    container_name: photosyncer
    ports:
      - "${PHOTO_SYNCER_PORT:-8232}:8080"
    environment:
      TZ: Asia/Shanghai
      APP_DB_PATH: /app/db/xiaomialbumsyncer.db
      PHOTO_SYNCER_MEDIA_ROOT: /app/db/media
    volumes:
      - ${PHOTO_SYNCER_STATE_DIR:-../db}:/app/db
      - ${PHOTO_SYNCER_EXPORT_DIR:-../download}:/photos
    restart: unless-stopped
