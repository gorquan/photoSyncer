name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/photosyncer

jobs:
  publish:
    name: Build and publish JVM image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'

      - name: Build frontend
        working-directory: web
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn install --immutable
          yarn build

      - name: Add frontend assets to server
        run: |
          rm -rf server/src/main/resources/static
          mkdir -p server/src/main/resources/static
          cp -R web/dist/. server/src/main/resources/static/

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Build application JAR
        working-directory: server
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon solonJar -PappVersion="${APP_VERSION}"
          ./gradlew --stop || true

      - name: Prepare Docker build context
        run: |
          # Solon 3.x may emit only the plain runtime jar. Prefer the
          # repackaged jar when available, but accept the plain jar as the
          # application image entrypoint as well.
          JAR_FILE="$(find server/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          if [ -z "${JAR_FILE}" ]; then
            JAR_FILE="$(find server/build/libs -maxdepth 1 -type f -name '*-plain.jar' | head -n 1)"
          fi
          test -n "${JAR_FILE}"
          cp "${JAR_FILE}" docker/app.jar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=photosyncer-jvm
          cache-to: type=gha,mode=max,scope=photosyncer-jvm,ignore-error=true
